[project]
name = "notes-mcp"
version = "1.0.0"
description = "A small MCP server for Markdown notes (course demo)"
requires-python = ">=3.12"
dependencies = ["mcp==2.3.0"]
license = "MIT"

[project.scripts]
notes-mcp = "notes_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notes_mcp"]
