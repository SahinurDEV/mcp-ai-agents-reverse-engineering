[project]
name = "notes-mcp"
version = "0.1.0"
description = "Course starter: notes MCP server (Section 5)"
requires-python = ">=3.11"
dependencies = ["mcp[cli]>=2.3.0"]

[project.scripts]
notes-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
